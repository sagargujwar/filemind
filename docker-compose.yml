services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/filemind
      - CLIENT_URL=http://localhost:5000
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - JWT_EXPIRES_IN=7d
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEMANTIC_SIMILARITY_THRESHOLD=0.55
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo

volumes:
  mongo_data:
  uploads_data:
